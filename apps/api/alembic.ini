[alembic]
script_location = migrations
# sqlalchemy.url is injected by hattama.cli / migrations/env.py from HATTAMA_DATABASE_URL

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
