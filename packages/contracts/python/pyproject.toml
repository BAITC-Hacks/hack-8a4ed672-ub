[project]
name = "hattama-contracts"
version = "1.0.0"
description = "Wire contracts of Hattama Live: audio ingestion protocol hattama.audio.v1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hattama_contracts"]
